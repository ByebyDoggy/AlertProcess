<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>规则链配置 - 链上安全监控</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .node-card {
      cursor: move;
      user-select: none;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .node-card:hover {
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      transform: scale(1.02);
    }
    .node-card.selected {
      box-shadow: 0 0 0 3px #3b82f6;
    }
    .edge-line {
      stroke: #6366f1;
      stroke-width: 2;
      fill: none;
      cursor: pointer;
    }
    .edge-line:hover {
      stroke: #818cf8;
      stroke-width: 3;
    }
    .palette-item {
      cursor: grab;
    }
    .palette-item:active {
      cursor: grabbing;
    }
    .canvas-area {
      background-image: radial-gradient(circle, #374151 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .modal-overlay {
      backdrop-filter: blur(4px);
    }
    .connection-point {
      width: 12px;
      height: 12px;
      background: #3b82f6;
      border: 2px solid white;
      border-radius: 50%;
      position: absolute;
      cursor: crosshair;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .node-card:hover .connection-point {
      opacity: 1;
    }
    .connection-point:hover {
      transform: scale(1.3);
      background: #60a5fa;
    }
    .temp-edge {
      stroke: #3b82f6;
      stroke-width: 2;
      stroke-dasharray: 5,5;
      fill: none;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div id="app">
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4">
      <div class="flex justify-between items-center max-w-full mx-auto">
        <div class="flex items-center gap-6">
          <div>
            <h1 class="text-2xl font-bold text-white">规则链配置</h1>
            <p class="text-gray-400 text-sm">可视化拖拽式规则链设计与配置</p>
          </div>
          <nav class="flex gap-4">
            <a href="./index.html" class="text-gray-400 hover:text-white px-3 py-2 rounded-lg hover:bg-gray-700 transition">告警仪表盘</a>
            <span class="text-blue-400 px-3 py-2 rounded-lg bg-gray-700">规则链配置</span>
          </nav>
        </div>
        <button @click="saveChain" :disabled="saving" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-600 rounded-lg text-white font-medium transition">
          {{ saving ? '保存中...' : '保存规则链' }}
        </button>
      </div>
    </header>

    <div class="flex h-[calc(100vh-80px)]">
      <node-palette></node-palette>

      <div class="flex-1 flex flex-col">
        <div class="p-4 border-b border-gray-700 flex items-center justify-between bg-gray-800">
          <div class="flex items-center gap-4 flex-wrap">
            <input v-model="chainName" placeholder="规则链名称..." 
                   class="bg-gray-700 text-white px-4 py-2 rounded-lg w-64 border border-gray-600 focus:border-blue-500 focus:outline-none">
            <input v-model="chainDescription" placeholder="描述（可选）..." 
                   class="bg-gray-700 text-white px-4 py-2 rounded-lg w-80 border border-gray-600 focus:border-blue-500 focus:outline-none">
            <label class="flex items-center gap-2 text-gray-300">
              <input type="checkbox" v-model="chainEnabled" class="w-4 h-4 rounded">
              启用
            </label>
          </div>
          <div v-if="currentChain" class="flex items-center gap-3">
            <button @click="deleteChain(currentChain.id)" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-white transition">删除规则链</button>
          </div>
        </div>

        <div class="flex-1 relative" style="display: flex;">
          <div class="w-64 bg-gray-800 border-r border-gray-700 p-4 overflow-y-auto">
            <rule-chain-list 
              :chains="ruleChains" 
              :current-chain="currentChain"
              @select="loadChain"
              @create="createNewChain"
              @clear="clearCanvas">
            </rule-chain-list>
          </div>

          <rule-chain-editor 
            ref="canvasContainer"
            :nodes="nodes" 
            :edges="edges"
            @update:nodes="updateNodes"
            @update:edges="updateEdges"
            @node-select="onNodeSelect"
            @edge-select="openEdgeConfig"
            @drop="onDrop"
            @node-dblclick="onNodeDoubleClick">
          </rule-chain-editor>
        </div>
      </div>
    </div>

    <!-- 节点配置弹窗 -->
    <node-config-editor 
      :node="selectedNode" 
      :visible="showConfigModal" 
      @save="saveNodeConfig" 
      @close="showConfigModal = false">
    </node-config-editor>

    <!-- 边配置弹窗 -->
    <div v-if="showEdgeModal" class="fixed inset-0 bg-black/60 modal-overlay flex items-center justify-center z-50">
      <div class="bg-gray-800 rounded-xl p-6 w-full max-w-md mx-4 border border-gray-700">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-bold text-white">连接设置</h3>
          <button @click="showEdgeModal = false" class="text-gray-400 hover:text-white text-2xl">&times;</button>
        </div>
        
        <div v-if="selectedEdge" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">连接标签</label>
            <input v-model="pendingEdgeLabel" placeholder="例如: 条件满足/不满足"
                   class="w-full bg-gray-700 text-white rounded-lg px-4 py-2 border border-gray-600 focus:border-blue-500 focus:outline-none">
          </div>
          
          <div class="flex justify-end gap-3 mt-6">
            <button @click="deleteEdge" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-white transition">删除连接</button>
            <button @click="saveEdgeLabel" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-white transition">保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
