version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DOCKER_ENV=true
    volumes:
      - ./data:/app/data
      - ./alerts.db:/app/alerts.db
    restart: unless-stopped
    networks:
      - alert-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - alert-network
    depends_on:
      - backend

networks:
  alert-network:
    driver: bridge
